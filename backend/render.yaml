services:
  - type: web
    name: airbcar-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py seed_data && python manage.py collectstatic --noinput"
    startCommand: "gunicorn airbcar_backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "airbcar-backend.onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: airbcar-db
          property: connectionString

databases:
  - name: airbcar-db
    region: frankfurt
    plan: free
    databaseName: airbcar
    user: airbcar_user
